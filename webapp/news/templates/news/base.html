<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Лента новостей инвестора{% endblock %}</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2933; --muted:#6b7785; --line:#e1e5ea;
          --accent:#1f5fa8; --pos:#1e8e4e; --neg:#c0392b; --neu:#6b7785; --warn:#b7791f; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); font-size:15px; }
  header { background:#16324f; color:#fff; padding:0 24px; display:flex; align-items:center; gap:28px; height:56px; }
  header .brand { font-weight:600; font-size:17px; }
  header nav a { color:#cfe0f3; text-decoration:none; margin-right:18px; }
  header nav a:hover, header nav a.active { color:#fff; }
  header .ml { margin-left:auto; font-size:13px; }
  main { max-width:1180px; margin:24px auto; padding:0 24px; }
  h1 { font-size:22px; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:18px 20px; margin-bottom:18px; }
  table { width:100%; border-collapse:collapse; background:var(--card); }
  th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:13px; color:var(--muted); font-weight:600; background:#fafbfc; }
  tr.alert td { background:#fff6f5; }
  a { color:var(--accent); }
  .badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .b-positive { background:#e3f5ea; color:var(--pos); } .b-negative { background:#fbe7e5; color:var(--neg); }
  .b-neutral { background:#eceff2; color:var(--neu); } .b-none { background:#fff4dc; color:var(--warn); }
  .b-status { background:#e8eef7; color:#2c4f7c; }
  .muted { color:var(--muted); font-size:13px; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:8px 16px;
         font-size:14px; cursor:pointer; text-decoration:none; }
  .btn.secondary { background:#e8eef7; color:#1f3f66; }
  form.filters { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:4px; }
  select, input, textarea { font:inherit; padding:7px 9px; border:1px solid #c9d1da; border-radius:6px; background:#fff; }
  textarea { width:100%; }
  .messages div { padding:10px 14px; border-radius:6px; margin-bottom:12px; }
  .msg-success { background:#e3f5ea; } .msg-warning { background:#fff4dc; } .msg-error { background:#fbe7e5; }
  .grid { display:grid; grid-template-columns: 1.3fr 1fr; gap:18px; }
  .bar { height:10px; background:#eceff2; border-radius:5px; overflow:hidden; }
  .bar span { display:block; height:100%; }
  dl { display:grid; grid-template-columns:170px 1fr; gap:8px 12px; margin:0; } dt { color:var(--muted); }
  .form-row { margin-bottom:12px; }
  .stats { display:flex; gap:12px; margin-bottom:16px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px 16px; min-width:150px; }
  .stat b { font-size:20px; display:block; }
</style>
</head>
<body>
<header>
  <div class="brand">InvestNews · лента новостей инвестора</div>
  <nav>
    <a href="{% url 'news_list' %}">Новости</a>
    <a href="{% url 'news_create' %}">Добавить новость</a>
    <a href="{% url 'portfolio' %}">Портфель</a>
    <a href="/admin/">Администрирование</a>
  </nav>
  {% block mlstatus %}{% endblock %}
</header>
<main>
  {% if messages %}<div class="messages">{% for m in messages %}<div class="msg-{{ m.tags }}">{{ m }}</div>{% endfor %}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
